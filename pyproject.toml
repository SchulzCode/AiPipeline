[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aipipe"
version = "1.0.1"
description = "Autonomous, agent-agnostic software engineering pipeline with a web control center."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
server = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "httpx>=0.27,<1.0",
  "PyJWT[crypto]>=2.9,<3.0",
  "itsdangerous>=2.2,<3.0"
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "fastapi>=0.115,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "httpx>=0.27,<1.0",
  "PyJWT[crypto]>=2.9,<3.0",
  "itsdangerous>=2.2,<3.0"
]

[project.scripts]
aipipe = "aipipe.cli:main"
aipipe-api = "aipipe.control.app:main"
aipipe-worker = "aipipe.control.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aipipe.templates" = ["global/*.md", "global/*.yml", "project/*.md", "project/*.yml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
